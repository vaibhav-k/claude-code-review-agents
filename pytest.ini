[pytest]
# tests/fixtures/ holds the validation matrix from DESIGN.md Section E as
# real source files -- deliberately incomplete/non-package snippets (see
# ruff.toml's extend-exclude and mypy.ini's exclude for the same directory,
# same reasoning) meant to be read by a human, a review agent, or fed to
# scripts/validate_fixtures.py's own harness -- never collected as an
# ad hoc pytest suite. Several fixture cases intentionally reuse the same
# basename across directories (e.g. test_discounts.py appears in both
# testing-coverage-review/boundary_case/ and .../false_positive_trap/,
# each read in isolation by that harness), and none of tests/fixtures/ has
# __init__.py files -- exactly the shape that makes a bare `pytest` run
# from the repo root fail collection with "import file mismatch" on the
# first basename collision it hits, even though nothing is actually wrong.
# This project's real test suite lives in cli/tests/ (run via
# `cd cli && pytest tests/`, or `pytest cli/tests` from the repo root);
# this file exists only to keep a bare `pytest` invocation at the repo
# root out of tests/fixtures/ so it collects that suite instead.
norecursedirs = tests/fixtures
