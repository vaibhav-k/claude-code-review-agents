# Repo-wide mypy config. `cli/` is a real installable Python package and
# is type-checked normally -- this file only exists to keep mypy from
# walking into the one place in the repo where static analysis doesn't
# apply.
#
# tests/fixtures/ holds the validation matrix from DESIGN.md Section E as
# real source files -- deliberately incomplete/broken snippets (undefined
# names, duplicate module names across true-positive/false-positive/
# boundary-case folders that were never meant to be imported as a single
# package, etc.) that exist to be read by a human or a review agent, not
# to type-check cleanly. This mirrors ruff.toml's extend-exclude for the
# same directory, for the same reason.
#
# mypy_path adds cli/tests so scripts/validate_fixtures.py's
# `from support.cassette import ...` (support/ is test-only code, never
# installed) resolves statically the same way it resolves at runtime via
# that script's own sys.path.insert(...) -- without this, mypy reports
# "Cannot find implementation or library stub for module named
# 'support.cassette'" even though the import works fine at runtime.
[mypy]
mypy_path = cli/tests
exclude = ^tests/fixtures/
