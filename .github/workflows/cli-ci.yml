name: CLI CI

# Runs the agent-review / agent-init CLI's own test suite, linter, and
# type checkers. Before this workflow existed, nothing in CI ran cli/'s
# 117+ pytest tests, ruff, or mypy at all -- a PR could silently break
# the CLI's orchestration, routing, or caching logic with zero automated
# feedback. This is intentionally separate from validate-agents.yml,
# which validates the .claude/agents/*.md prompt files against
# tests/fixtures/ -- a different subsystem with a different audience
# (prompt authors vs. CLI contributors).
#
# `.claude/agents/**` and root `CLAUDE.md` are ALSO trigger paths here
# (2026-09-18 addition), even though this workflow's own code lives
# entirely under cli/: cli/tests/test_default_rules_sync.py asserts the
# bundled cli/src/agent_review/default_rules/ copies of these files are
# byte-identical to the real ones, and that assertion is only worth
# anything if it actually runs on the PR that edits a prompt without
# touching anything else under cli/ -- which is the exact shape of the
# real drift this test exists to catch (see that file's own docstring).

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.claude/agents/**'
      - 'CLAUDE.md'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.claude/agents/**'
      - 'CLAUDE.md'
      - '.github/workflows/cli-ci.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors cli/pyproject.toml's requires-python = ">=3.10" floor,
        # plus the two newest stable releases at time of writing -- not
        # every patch release, just enough to catch a version-specific
        # regression without inflating CI time for a small package.
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: cli/pyproject.toml

      - name: Install cli/ with dev dependencies
        run: pip install -e "./cli[dev]"

      - name: pytest
        run: python -m pytest cli/tests -q

      - name: ruff
        # Run from the repo root so it picks up the root ruff.toml (which
        # in turn defers to cli/'s own linting the same way, per its own
        # header comment) -- matches how this is documented in
        # cli/README.md's Development section.
        run: python -m ruff check cli

      - name: mypy
        run: python -m mypy cli/src/agent_review

  typecheck-pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cli/pyproject.toml

      - name: Install cli/ with dev dependencies
        run: pip install -e "./cli[dev]"

      - name: Install pyright
        run: pip install pyright

      - name: pyright
        # Repo root so it picks up pyrightconfig.json's extraPaths, the
        # same way a contributor's editor does (see cli/README.md's
        # "Import agent_review could not be resolved" section).
        run: pyright cli/src/agent_review
